<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANIMAE Landing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap">
<style>:root{
  --bg:#141725;--surface:#1f2333;--surface2:#1a1d2e;--border:#3a3f5a;--deep:#0f1018;
  --primary:#ff5c02;--blue:#3c7bff;--pink:#ff2e8a;--amber:#ff9f2a;--ok:#32d27f;
  --t0:#f9faff;--t1:#eceff8;--t2:#b0b3c6;--t3:#7e85a3;
  --display:'Urbanist',system-ui,sans-serif;
  --gutter:80px;
  --r-sm:2px;--r-md:6px;--r-lg:10px;--r-xl:14px;
  --font:'Urbanist',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{overflow-x:clip;scroll-behavior:smooth;scroll-padding-top:104px}
body{margin:0;background:var(--bg);color:var(--t0);font:500 16px/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;height:auto}
a{color:inherit}
p{margin:0}
.wrap{width:min(1920px,100% - 2 * var(--gutter));margin-inline:auto}
.center{text-align:center;margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;color:var(--t0);letter-spacing:-.035em}
.w{display:inline-block;overflow:visible;vertical-align:top}.wi{display:inline-block;will-change:transform}
h1{font-size:clamp(44px,4.4vw,80px);line-height:1.04}
h2{font-size:clamp(36px,3vw,56px);line-height:1.08}
h3{font-size:clamp(24px,1.7vw,32px);line-height:1.15}
.lead,.sub{color:var(--t2);font-weight:400}
.sub{margin:24px auto 0;max-width:52ch;font-size:clamp(16px,1.25vw,24px);line-height:1.5}

/* botões: hover preenche com um retângulo lateral */
.btn{--fill:#b8460f;position:relative;isolation:isolate;overflow:hidden;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:12px;height:64px;min-width:280px;padding:0 56px;border:0;border-radius:var(--r-md);background:var(--primary);color:var(--t0);font:800 18px/1 var(--display);letter-spacing:0;text-decoration:none;cursor:pointer;box-shadow:0 8px 16px rgba(255,92,2,.25)}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--fill);transform:translateX(-101%);transition:transform .5s cubic-bezier(.65,0,.35,1)}
.btn:hover::before,.btn:focus-visible::before{transform:none}
.btn:focus-visible,.faq__q:focus-visible,.tab:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn--pink{--fill:var(--pink);background:#1f2333;border:1.5px solid rgba(255,255,255,.2);color:var(--t0);box-shadow:none;transition:border-color .3s}
.btn--pink svg{flex:none;color:var(--pink);transition:color .3s,transform .3s}
.btn--pink:hover{border-color:var(--pink)}
.btn--pink:hover svg{color:#fff;transform:translate(2px,-2px)}
.btn:disabled{background:var(--ok);color:var(--deep);cursor:default}
.btn:disabled::before{display:none}

/* nav fixa */
.nav{position:fixed;inset:0 0 auto;z-index:30;transition:background .3s,backdrop-filter .3s,box-shadow .3s}
.nav.is-stuck{background:rgba(20,23,37,.88);backdrop-filter:blur(12px)}
.nav__in{display:flex;align-items:center;justify-content:space-between;padding-block:16px;gap:24px}
.nav__logo{display:block;height:40px;width:auto}
.nav__right{display:flex;align-items:center;gap:40px}
.nav__links{display:flex;gap:8px}
.nav__links a{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:48px;padding:0 16px;font:600 16px/1 var(--display);text-decoration:none;color:var(--t1);transition:color .2s}
.nav__links a:hover{color:var(--primary)}

/* hero */
.hero{padding:152px 0 0;text-align:center;overflow:hidden;background:radial-gradient(800px 420px at 50% 62%,rgba(255,92,2,.18),transparent 70%)}
.hero__in{display:flex;flex-direction:column;align-items:center}
.hero .lead{max-width:56ch;margin-top:24px;font-size:clamp(16px,1.25vw,24px);line-height:1.5}
.hero__cta{display:flex;gap:24px;margin-top:32px;flex-wrap:wrap;justify-content:center}
.proof{display:flex;align-items:center;gap:20px;margin-top:24px;font-size:14px;color:var(--t2);font-weight:400}
.proof b{color:var(--t0);font-weight:700}
.dots{display:inline-flex}
.dots i{width:24px;height:24px;border-radius:50%;background:var(--c);border:2px solid var(--bg);margin-right:-8px}
.dots--lg{margin-bottom:24px;padding-right:12px}.dots--lg i{width:40px;height:40px;margin-right:-12px}
.hero__stage{position:relative;margin-top:64px;height:560px;width:min(640px,100%);display:flex;justify-content:center}
.hero__draco{position:absolute;top:-24px;right:-24px;width:240px;height:auto;z-index:3;filter:drop-shadow(0 16px 24px rgba(0,0,0,.5));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.hero__draco{animation:none}html{scroll-behavior:auto}}

/* phone mockup */
.phone{width:300px;flex:none;border:6px solid #1e2130;border-radius:var(--r-xl);background:var(--deep);padding:14px;box-shadow:0 36px 40px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.1);text-align:left}
.phone__in{border-radius:var(--r-lg);background:var(--bg);padding:16px;min-height:430px;overflow:hidden;font-size:13px}
.phone--hero{position:absolute;top:0;width:320px}
.phone--low{margin-top:34px}
.phone--tall{margin-bottom:-120px}
.ui-tabs{display:flex;gap:16px;font-size:13px;color:var(--t3);margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:8px}
.ui-tabs b{color:var(--t0);border-bottom:2px solid var(--primary);padding-bottom:7px;margin-bottom:-9px}
.ui-stories{display:flex;gap:10px;margin-bottom:16px}
.ui-stories i,.ui-post__h i{width:46px;height:46px;border-radius:50%;background:var(--c);border:3px solid var(--primary);box-shadow:inset 0 0 0 3px var(--bg)}
.ui-post{background:var(--surface);border-radius:var(--r-md);padding:12px;margin-bottom:10px}
.ui-post__h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.ui-post__h i{width:34px;height:34px;border-width:0;box-shadow:none}
.ui-post__h b{display:block;font-size:13px;line-height:1.2}.ui-post small{color:var(--t3);font-size:11px}
.ui-post p{color:var(--t2);font-size:12.5px;line-height:1.45}
.ui-post__img{height:120px;border-radius:var(--r-sm);margin-bottom:8px;background:linear-gradient(135deg,#7a2a10,#ff5c02 60%,#ff9f2a);display:grid;place-items:center}
.ui-post__img span{font:400 28px/1 var(--display);text-align:center;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.ui-chips{display:flex;gap:6px;margin-bottom:12px}.ui-chips em{font-style:normal;font-size:11px;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--t2)}
.ui-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ui-grid i{height:110px;border-radius:var(--r-md);background:linear-gradient(160deg,var(--c),#141725 130%)}
.ui-note{margin-top:12px;color:var(--t3);font-size:12px}
.ui-badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.ui-badges i{font-style:normal;display:grid;place-items:center;height:76px;border-radius:var(--r-md);background:var(--surface);font-size:30px}
.xp{height:10px;background:var(--border);border-radius:999px;margin-top:18px;overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--amber))}

/* sections */
.sec{padding:96px 0}
.bento{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:1fr 1fr;gap:16px;margin:64px auto 48px;perspective:1200px}
.bcard{grid-column:span 8;position:relative;display:flex;gap:16px;justify-content:space-between;align-items:flex-start;padding:32px;border-radius:var(--r-lg);background:#1f2333;border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 2px 4px rgba(255,255,255,.06);overflow:hidden;min-height:264px;transition:transform .45s cubic-bezier(.22,1,.36,1),border-color .3s}
.bcard:hover{transform:scale(.97);border-color:rgba(255,255,255,.28)}
.bcard p{margin-top:8px;font-size:16px;color:var(--t2);font-weight:400;max-width:40ch}
.bcard img{align-self:flex-end;width:128px;flex:none}
.bcard--tall{grid-column:span 4;grid-row:span 2;flex-direction:column;justify-content:flex-start;padding-bottom:0}
.strip{display:flex;margin:auto -32px 0;height:300px;align-items:flex-end;width:calc(100% + 64px)}
.strip i{flex:1;height:100%;display:grid;place-items:center;font:800 40px var(--font);font-style:normal;color:#fff;background:linear-gradient(to bottom,#1f2333 0%,var(--c) 70%)}

.tabcard{position:relative;margin:64px 0 48px}
.tabs{position:relative;z-index:1;display:flex;justify-content:center;gap:0;margin:0 auto -1px;width:max-content;max-width:100%}
.tab{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:16px;width:280px;height:72px;padding:0 24px;background:#1f2333;color:var(--t0);border:1px solid rgba(255,255,255,.12);border-bottom:0;border-left-width:0;border-radius:0;font:700 18px/1 var(--display);cursor:pointer;text-align:center;transition:border-color .3s}
.tab:first-child{border-left-width:1px;border-top-left-radius:var(--r-md)}.tab:last-child{border-top-right-radius:var(--r-md)}
.tab::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--primary);transform:translateX(-101%);transition:transform .5s cubic-bezier(.65,0,.35,1)}
.tab:hover::before{transform:none}
.tab img{width:32px;height:auto;flex:none}
.tab.is-on{background:var(--primary);border-color:var(--primary)}
.tab.is-on::before{display:none}
.tabcard__body{position:relative;border-radius:var(--r-xl);background:#1f2333;border:1px solid rgba(255,255,255,.12);overflow:hidden}
.panel{position:relative;height:720px;overflow:hidden}
.panel[hidden]{display:none}
.panel__phones{display:flex;justify-content:center;gap:48px;padding-top:56px}
.panel__fade{position:absolute;inset:auto 0 0;height:400px;background:linear-gradient(to top,#1f2333 38%,rgba(31,35,51,0))}
.panel__text{position:absolute;inset:auto 0 56px;text-align:center;padding:0 24px}
.panel__text h3{font-size:clamp(32px,2.6vw,48px)}
.panel__text p{max-width:560px;margin:16px auto 0;font-size:16px;color:var(--t1);font-weight:500}

.split{display:grid;grid-template-columns:5fr 7fr;align-items:center;gap:40px}
.split__text{display:flex;flex-direction:column;align-items:flex-start;gap:24px}
.split__text .sub{margin:0;max-width:48ch}
.split__card{height:720px;border-radius:var(--r-xl);background:var(--surface);overflow:hidden;display:flex;justify-content:center;padding-top:59px}
.split__card .phone{width:360px}

.proofsec{background:linear-gradient(var(--bg),rgba(20,23,37,.2) 50%,var(--bg)),radial-gradient(600px 300px at 50% 50%,rgba(60,123,255,.14),transparent 70%)}
.big{font:800 clamp(48px,6vw,112px)/1 var(--display);letter-spacing:-.04em;margin-bottom:16px}
.proofsec .sub{margin:0 auto 32px}.proofsec .sub b{color:var(--t0)}

/* faq */
.faqwrap{padding:0}
.faqwrap h2{margin-bottom:40px}
.faq{display:grid;gap:16px}
.faq__item{background:var(--surface2);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-md);padding:24px;transition:border-color .3s,background .3s}
.faq__item:hover{border-color:rgba(255,255,255,.16)}
.faq__item.is-open{background:#1f2438;border-color:rgba(255,255,255,.16)}
.faq__q{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;font:700 20px/1.5 var(--font);color:var(--t0)}
.faq__ic{position:relative;flex:none;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);transition:background .3s}
.faq__ic::before,.faq__ic::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;border-radius:2px;background:var(--t3);transform:translate(-50%,-50%);transition:background .3s}
.faq__ic::after{transform:translate(-50%,-50%) rotate(90deg)}
.faq__q:hover .faq__ic{background:rgba(255,255,255,.12)}
.is-open .faq__ic{background:var(--primary)}.is-open .faq__ic::before{background:#fff}.is-open .faq__ic::after{display:none}
.faq__a{margin-top:20px;max-width:805px;color:var(--t2);font-size:14px;font-weight:400}
.faq__a[hidden]{display:none}

/* newsletter box */
.box{max-width:1040px;margin:0 auto;padding:56px;border-radius:var(--r-lg);background:linear-gradient(250deg,#141725 0%,#1f1428 59%,#2a1020 99%);box-shadow:0 0 60px rgba(255,46,138,.2),0 24px 48px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.box .sub{margin:4px 0 0;font-size:16px}
.box__cta{margin-top:20px}
.form{display:flex;gap:16px;width:100%;margin-top:16px}
.form input{flex:1;min-width:0;height:64px;padding:0 24px;border-radius:var(--r-md);border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.08);color:var(--t0);font:400 16px var(--font)}
.form input::placeholder{color:var(--t0);opacity:.8}
.box small{font-size:12px;color:var(--t3)}

.marquee{overflow:hidden;background:var(--primary);color:var(--deep);padding:24px 0;margin-top:48px}
.marquee__track{display:flex;width:max-content}
.marquee__set{display:flex;align-items:center;gap:48px;padding-right:48px;flex:none}
.marquee__set span{font:800 clamp(32px,3.2vw,56px)/1 var(--display);letter-spacing:-.03em;white-space:nowrap}
.marquee__set img{height:64px;width:auto;flex:none}

.footer{padding:32px 0}
.footer__in{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:14px}
.footer__in p{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.footer__in p i{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.footer a{text-decoration:none}.footer a:hover{color:var(--primary)}

/* responsivo */
@media (max-width:1280px){:root{--gutter:40px}}
@media (max-width:1000px){
  :root{--gutter:24px}
  .nav__links{display:none}
  .bcard,.bcard--tall{grid-column:span 12;grid-row:auto}
  .bento{grid-template-rows:auto}
  .split{grid-template-columns:1fr}
  .tabs{width:100%}
  .tab{width:auto;flex:1;height:64px;font-size:16px;padding:0 12px;gap:8px}.tab img{width:28px}
  .panel__phones .phone:nth-child(2){display:none}
}
@media (max-width:600px){
  :root{--gutter:16px}
  .sec{padding:64px 0}
  .btn{height:56px;padding:0 24px;font-size:16px}
  .hero{padding-top:104px}
  .hero__cta .btn{width:100%}
  .nav__logo{height:32px}.nav .btn{height:48px;padding:0 16px;font-size:14px}
  .nav__right{gap:0}
  .hero__stage{height:480px}
  .hero__draco{width:136px;right:-4px;top:-30px}
  .phone,.phone--hero{width:272px}.phone__in{min-height:400px}
  .tab span{display:none}.tab img{display:block;width:32px}
  .panel{height:640px}
  .split__card{height:520px}
  .faq__q{font-size:17px}
  .box{padding:32px 24px}
  .form{flex-direction:column;gap:12px}.form .btn{width:100%}
  .bcard{padding:24px}.bcard img{width:96px}.strip{margin-inline:-24px;width:calc(100% + 48px)}
  .marquee__set img{height:48px}
}

.nav .btn{height:48px;min-width:0;padding:0 24px;font-size:15px;border-radius:var(--r-md)}

.bubble{position:absolute;top:8px;left:-24px;max-width:216px;padding:12px 16px;background:var(--t1);color:var(--deep);border-radius:var(--r-md) var(--r-md) var(--r-md) var(--r-sm);font-weight:700;font-size:16px;line-height:1.3;z-index:4;transform:rotate(-3deg);text-align:left}
.dracoquote{display:flex;width:max-content;max-width:100%;margin:40px auto 0;align-items:center;gap:16px;padding:16px 24px;background:#1f2333;border:1px solid rgba(255,255,255,.12);border-radius:var(--r-md);font-weight:600;color:var(--t1);text-align:left}
.dracoquote img{width:48px;height:auto;flex:none}.dracoquote b{color:var(--primary)}
@media (max-width:600px){.bubble{left:0;top:-8px;max-width:176px;font-size:14px}.nav .btn{height:40px;padding:0 16px;font-size:13px}}
.tab.is-on img{filter:brightness(0) invert(1)}

@media (max-width:600px){.btn{min-width:0}.hero__cta{gap:16px}}

/* telas reais do app */
.phone__in:has(.shot){padding:0;min-height:0}
.shot{display:block;width:100%;height:auto}
.phone--hero .phone__in{max-height:540px}.panel__phones .phone__in{max-height:500px}
.hero__stage{height:620px}
.strip{gap:0}.strip img{flex:1;min-width:0;height:100%;width:33.3%;object-fit:cover;align-self:stretch;margin:0}
.strip img+img{border-left:2px solid var(--bg)}
.bcard img.bcard__draco{width:176px;align-self:flex-end;margin:0 -8px -24px 0}
.hero__draco{width:260px}

/* cards do problema: igual ao Figma (03 · problema) */
.bento{display:grid;grid-template-columns:483px 442px;grid-template-rows:auto;gap:12px;justify-content:center;margin:48px auto;perspective:none}
.bento__col{display:flex;flex-direction:column;gap:12px}
.bcard{grid-column:auto;grid-row:auto;position:relative;display:block;padding:0;min-height:0;border-radius:24px;background:#1f2333 center/cover no-repeat;border:0;box-shadow:none;overflow:hidden}
.bcard--a{height:516px}.bcard--b,.bcard--c{height:252px;width:442px}
.bcard__text{position:relative;z-index:2;padding:28px}
.bcard h3{font-size:28px;line-height:1.1}
.bcard p{margin-top:8px;font-size:14px;line-height:1.5;font-weight:400;color:#b0b3c6;max-width:325px}
.bcard--b p{max-width:253px}.bcard--c p{max-width:219px;color:var(--t0)}
.bcard img.bcard__collage{position:absolute;left:0;bottom:0;width:100%;height:auto;display:block}
@media (max-width:1000px){
  .bento{grid-template-columns:minmax(0,483px)}
  .bcard,.bcard--tall{grid-column:auto}
  .bcard--b,.bcard--c{width:100%;background-position:right center;background-size:auto 100%}
  .bcard--a{height:516px}
}

/* sinalização de telas que faltam (desligue com SHOW_TODO=false em main.js) */
.phone__in{position:relative}
.todo{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px;margin:8px;border:2px dashed var(--primary);border-radius:var(--r-lg);background:rgba(255,92,2,.08)}
.todo b{font-size:12px;letter-spacing:.08em;color:var(--primary)}
.todo span{font-size:22px;font-weight:800;color:var(--t0);line-height:1.15}
.todo small{font-size:13px;color:var(--t2);max-width:20ch}
.flag{position:absolute;top:10px;left:10px;right:10px;z-index:5;padding:6px 10px;border-radius:var(--r-md);background:var(--primary);color:#141725;font-size:12px;font-weight:800;text-align:center}
.bcard--b h3,.bcard--c h3{max-width:230px}

/* lista de espera discreta no rodapé */
.footer{border-top:1px solid rgba(255,255,255,.08);padding:40px 0 32px;margin-top:64px}
.footer__lista{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding-bottom:28px;margin-bottom:24px;border-bottom:1px solid rgba(255,255,255,.08)}
.footer__lista p{margin:0;font-size:14px;color:var(--t2);max-width:44ch}
.form--mini{width:auto;margin:0;gap:8px;flex:0 1 420px}
.form--mini input{height:48px;padding:0 16px;font-size:14px;background:rgba(255,255,255,.06)}
.form--mini input::placeholder{color:var(--t2);opacity:1}
.btn.btn--mini{min-width:0;height:48px;padding:0 32px;font-size:14px;box-shadow:0 6px 12px rgba(255,92,2,.2)}
.footer__in{font-size:12px}.footer__in a,.footer__in p{font-size:12px}
@media (max-width:640px){.form--mini{flex:1 1 100%}}

/* hero: mão do Draco segurando a home */
.hero__stage{height:auto;margin-top:56px;width:min(560px,100%);display:block;overflow:hidden;max-height:640px;-webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,#000 80%,transparent 100%)}
.hero__hand{display:block;width:100%;height:auto;margin:0 auto;filter:drop-shadow(0 24px 32px rgba(0,0,0,.45))}
.hero__stage .bubble{top:56px;left:-8px}

/* ── Animações (GSAP). Sem GSAP ou com movimento reduzido, a página fica estática. ── */
const g = window.gsap;
const nav = document.querySelector('.nav');
const onScroll = () => nav.classList.toggle('is-stuck', scrollY > 24);
addEventListener('scroll', onScroll, { passive: true }); onScroll();

if (g && !reduce) {
  if (window.ScrollTrigger) g.registerPlugin(ScrollTrigger);

  // divide o título em palavras para o efeito 3D de impressão
  const split = el => {
    const walk = node => [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) {
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(w => {
          if (!w) return;
          if (/^\s+$/.test(w)) { frag.append(' '); return; }
          const o = document.createElement('span'); o.className = 'w';
          const i = document.createElement('span'); i.className = 'wi'; i.textContent = w;
          o.append(i); frag.append(o);
        });
        n.replaceWith(frag);
      } else if (n.nodeType === 1 && n.tagName !== 'BR') walk(n);
    });
    walk(el);
    return el.querySelectorAll('.wi');
  };

  const reveal = (el, vars = {}) => {
    const words = split(el);
    const st = vars.trigger === false ? undefined : { trigger: el, start: 'top 88%', once: true };
    g.from(words, { rotationX: -95, yPercent: 60, opacity: 0, transformOrigin: '50% 100% -24', duration: .9, stagger: .06, ease: 'power3.out', scrollTrigger: st, delay: vars.delay || 0, clearProps: 'transform,opacity' });
  };

    .from('.proof', { y: 16, opacity: 0, duration: .6 }, '-=.4')
    .from('.hero__hand', { y: 110, scale: .92, opacity: 0, filter: 'blur(18px)', duration: 2, ease: 'power3.out', clearProps: 'transform,opacity,filter' }, '-=.8');

  g.from('.tabs .tab', { y: 24, opacity: 0, duration: .6, stagger: .08, ease: 'power2.out', scrollTrigger: { trigger: '.tabcard', start: 'top 88%', once: true }, clearProps: 'transform,opacity' });
  gsap.set('.tabcard .phone', { willChange: 'transform,opacity' });
  g.timeline({ scrollTrigger: { trigger: '.tabcard', start: 'top 82%', once: true }, defaults: { ease: 'power3.out' } })
    .from('.panel:not([hidden]) .phone', { y: 90, rotationX: 30, opacity: 0, transformOrigin: '50% 100%', transformPerspective: 1200, duration: 1.1, stagger: .14, clearProps: 'transform,opacity,willChange' })
    .from('.panel:not([hidden]) .panel__text', { y: 20, opacity: 0, duration: .7, clearProps: 'transform,opacity' }, '-=.55');

  g.from('.split__card', { x: 64, opacity: 0, duration: 1, ease: 'power3.out', scrollTrigger: { trigger: '.split', start: 'top 80%', once: true }, clearProps: 'transform,opacity' });
  g.timeline({ scrollTrigger: { trigger: '.android', start: 'top 70%', once: true }, defaults: { ease: 'power3.out' },
      onComplete: () => {
        g.to('.android__draco', { y: -10, duration: 2.6, ease: 'sine.inOut', yoyo: true, repeat: -1 });
        g.to('.android__bubble', { rotation: 1.6, y: -4, duration: 3.2, ease: 'sine.inOut', yoyo: true, repeat: -1, transformOrigin: '10% 100%' });

    .from('.android__bubble', { scale: .6, rotation: -8, y: 20, opacity: 0, transformOrigin: '10% 100%', duration: .8, ease: 'back.out(2)', clearProps: 'transform,opacity' }, '-=.5')
    .from('.android__text > *', { y: 24, opacity: 0, duration: .7, stagger: .08, clearProps: 'transform,opacity' }, 0);
  g.from('.faq__item', { y: 24, opacity: 0, duration: .6, stagger: .08, ease: 'power3.out', scrollTrigger: { trigger: '.faq', start: 'top 85%', once: true }, clearProps: 'transform,opacity' });

  }

  // interações com mouse (só em telas com mouse)
  if (matchMedia('(hover:hover) and (pointer:fine)').matches) {
    // celulares das abas inclinam em 3D
    const body = document.querySelector('.tabcard__body');
    if (body) {
      body.querySelectorAll('.panel__phones').forEach(ph => g.set(ph, { transformPerspective: 1400, transformOrigin: '50% 0%' }));
      const rx = g.quickTo('.panel__phones', 'rotationX', { duration: .8, ease: 'power3.out' });
      const ry = g.quickTo('.panel__phones', 'rotationY', { duration: .8, ease: 'power3.out' });
      body.addEventListener('pointermove', e => { const r = body.getBoundingClientRect(); ry(((e.clientX - r.left) / r.width - .5) * 8); rx(((e.clientY - r.top) / r.height - .5) * -4); });
      body.addEventListener('pointerleave', () => { rx(0); ry(0); });
    }
    // Draco acompanha o mouse
    const sec = document.querySelector('.android'), stage = document.querySelector('.android__stage');
    if (sec && stage) {
      g.set(stage, { transformPerspective: 900 });
      const sy = g.quickTo(stage, 'rotationY', { duration: 1.4, ease: 'power2.out' });
      const sx = g.quickTo(stage, 'rotationX', { duration: 1.4, ease: 'power2.out' });
      sec.addEventListener('pointermove', e => { const r = sec.getBoundingClientRect(); sy(((e.clientX - r.left) / r.width - .5) * 10); sx(((e.clientY - r.top) / r.height - .5) * -5); });
      sec.addEventListener('pointerleave', () => { sx(0); sy(0); });
    }
    // cards sobem de leve ao passar o mouse
    document.querySelectorAll('.bcard').forEach(c => {
      c.addEventListener('pointerenter', () => g.to(c, { y: -6, duration: .35, ease: 'power3.out', overwrite: 'auto' }));
      c.addEventListener('pointerleave', () => g.to(c, { y: 0, duration: .45, ease: 'power3.out', overwrite: 'auto' }));
    });
    // botões magnéticos
    document.querySelectorAll('.btn:not(.btn--mini)').forEach(b => {
      const bx = g.quickTo(b, 'x', { duration: .5, ease: 'power3.out' }), by = g.quickTo(b, 'y', { duration: .5, ease: 'power3.out' });
      b.addEventListener('pointermove', e => { const r = b.getBoundingClientRect(); bx((e.clientX - r.left - r.width / 2) * .14); by((e.clientY - r.top - r.height / 2) * .22); });
      b.addEventListener('pointerleave', () => { bx(0); by(0); });
    });
  }

  // marquee contínuo, pausa ao passar o mouse
  const track = document.querySelector('.marquee__track');
  const mq = g.to(track, { xPercent: -50, duration: 40, ease: 'none', repeat: -1 });
  track.parentElement.addEventListener('mouseenter', () => g.to(mq, { timeScale: .15, duration: .5 }));
  if (window.ScrollTrigger) ScrollTrigger.create({ onUpdate: self => { const v = g.utils.clamp(-6, 6, self.getVelocity() / 400); g.to(mq, { timeScale: 1 + Math.abs(v), duration: .3, overwrite: 'auto' }); g.to(mq, { timeScale: 1, duration: 1.2, delay: .3 }); } });
  track.parentElement.addEventListener('mouseleave', () => g.to(mq, { timeScale: 1, duration: .5 }));
}
</script></body></html>
